---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhacs
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jmhbnz/talks.git
    targetRevision: HEAD
    path: 2026-10-15-rhacs-declarative-install/rhacs

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
