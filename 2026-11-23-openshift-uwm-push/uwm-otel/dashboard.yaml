apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  labels:
    app.kubernetes.io/name: uwm-otel-batch-jobs
    app.kubernetes.io/part-of: uwm-demo
  name: uwm-otel-batch-jobs
  namespace: uwm-demo
spec:
  config:
    display:
      description: Metrics from short lived jobs pushed via OTLP to the OpenTelemetry Collector
      name: UWM OTLP - Batch Jobs
    duration: 1h
    layouts:
      - kind: Grid
        spec:
          display:
            title: OTLP Batch Job Metrics
          items:
            - content:
                $ref: '#/spec/panels/batch_job_duration'
              height: 6
              width: 12
              x: 0
              "y": 0
            - content:
                $ref: '#/spec/panels/batch_job_status'
              height: 6
              width: 12
              x: 12
              "y": 0
            - content:
                $ref: '#/spec/panels/collector_up'
              height: 6
              width: 24
              x: 0
              "y": 6
    panels:
      batch_job_duration:
        kind: Panel
        spec:
          display:
            description: Duration reported by the batch job on its last OTLP push
            name: Batch Job Duration
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
              yAxis:
                label: seconds
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: otel_batch_job_duration_seconds{namespace="uwm-demo", job="otel-collector", exported_job="otel-batch-demo"}
                    seriesNameFormat: '{{exported_job}} duration'
      batch_job_status:
        kind: Panel
        spec:
          display:
            description: Result reported by the batch job on its last OTLP push
            name: Batch Job Status
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
              yAxis:
                label: status
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: otel_batch_job_status{namespace="uwm-demo", job="otel-collector", exported_job="otel-batch-demo"}
                    seriesNameFormat: '{{exported_job}} status'
      collector_up:
        kind: Panel
        spec:
          display:
            description: Whether user workload monitoring is successfully scraping the collector
            name: Collector Scrape Status
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
              yAxis:
                label: up
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: up{namespace="uwm-demo", job="otel-collector"}
                    seriesNameFormat: '{{pod}}'
