---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: uwm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: quay.io/prometheus/pushgateway:v1.11.5
          ports:
            - name: web
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: web
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web

---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: uwm-demo
  labels:
    app: pushgateway
spec:
  selector:
    app: pushgateway
  ports:
    - name: web
      port: 9091
      targetPort: web

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: uwm-demo
spec:
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: web
      interval: 30s
